name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Syntax check
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1, *.psm1 | ForEach-Object {
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e) | Out-Null
            if ($e) { $bad++; Write-Host "::error file=$($_.FullName)::$($e.Message -join '; ')" }
          }
          if ($bad) { throw "$bad file(s) failed to parse" }

      - name: PSScriptAnalyzer
        shell: pwsh
        continue-on-error: true
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning, Error -ReportSummary

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the GUI
        shell: pwsh
        run: dotnet build ui/WinSetup.Pro.UI/WinSetup.Pro.UI.csproj -c Release --nologo

      - name: Unit tests
        shell: pwsh
        run: ./tests/RunTests.ps1 -Suite unit -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: logs/testresults.xml
          if-no-files-found: ignore
